packages:
  - "apps/*"
  - "packages/*"
  - "experiments/*"

# Install scripts run only for a package named here with `true`; a package named with `false`
# is refused by name, and an install that meets an unlisted one stops until that package is
# reviewed and listed here.
# - esbuild (through storybook and vite): its postinstall only checks that the platform
#   package (@esbuild/<platform>, an optional dependency pnpm installs) is present and copies
#   its binary over bin/esbuild as a speed-up. The JavaScript API finds the platform package
#   without it, so it is refused.
allowBuilds:
  esbuild: false

# A release younger than a day is refused (pnpm.io/settings/dependency-resolution). Wait it
# out; never lower it.
minimumReleaseAge: 1440

# A release whose publishing evidence is weaker than an earlier release's (lost provenance or
# trusted publishing) is refused (pnpm.io/settings/dependency-resolution).
trustPolicy: no-downgrade
